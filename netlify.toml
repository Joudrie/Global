[build]
  command = "npm run build"
  publish = "dist"

# The content-page generator (scripts/prerender.mjs) imports the TypeScript data
# directly via Node's native type stripping, which needs Node 22+.
[build.environment]
  NODE_VERSION = "22"

# No catch-all SPA redirect: the app has no client-side routes (deep links use
# ?play=), so unknown paths fall through to the generated 404.html and return a
# real 404 instead of the homepage.

# Vite names every bundle by its content hash, so a file under /assets/ never
# changes: let browsers keep it for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
